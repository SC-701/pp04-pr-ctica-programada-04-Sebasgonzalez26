name: Publicar paquetes NuGet de Autorización

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Seguridad/Seguridad.MiddlewareAutorizacion/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar solución
        run: |
          dotnet restore "Seguridad/Seguridad.MiddlewareAutorizacion/AutorizacionMiddleware.sln"

      - name: Compilar solución en Release
        run: |
          dotnet build "Seguridad/Seguridad.MiddlewareAutorizacion/AutorizacionMiddleware.sln" --configuration Release --no-restore

      - name: Limpiar carpeta de paquetes
        run: |
          rm -rf "Seguridad/Seguridad.MiddlewareAutorizacion/nupkgs"
          mkdir -p "Seguridad/Seguridad.MiddlewareAutorizacion/nupkgs"

      - name: Empaquetar Abstracciones
        run: |
          dotnet pack "Seguridad/Seguridad.MiddlewareAutorizacion/Autorizacion.Abstracciones/Autorizacion.Abstracciones.csproj" --configuration Release --no-build --output "Seguridad/Seguridad.MiddlewareAutorizacion/nupkgs"

      - name: Empaquetar DA
        run: |
          dotnet pack "Seguridad/Seguridad.MiddlewareAutorizacion/Autorizacion.DA/Autorizacion.DA.csproj" --configuration Release --no-build --output "Seguridad/Seguridad.MiddlewareAutorizacion/nupkgs"

      - name: Empaquetar Flujo
        run: |
          dotnet pack "Seguridad/Seguridad.MiddlewareAutorizacion/Autorizacion.Flujo/Autorizacion.Flujo.csproj" --configuration Release --no-build --output "Seguridad/Seguridad.MiddlewareAutorizacion/nupkgs"

      - name: Empaquetar Middleware
        run: |
          dotnet pack "Seguridad/Seguridad.MiddlewareAutorizacion/Autorizacion.Middleware/Autorizacion.Middleware.csproj" --configuration Release --no-build --output "Seguridad/Seguridad.MiddlewareAutorizacion/nupkgs"

      - name: Configurar origen NuGet de GitHub
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/SC-701/index.json" \
            --name "github" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Publicar paquetes en GitHub Packages
        run: |
          dotnet nuget push "Seguridad/Seguridad.MiddlewareAutorizacion/nupkgs/*.nupkg" \
            --source "github" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate