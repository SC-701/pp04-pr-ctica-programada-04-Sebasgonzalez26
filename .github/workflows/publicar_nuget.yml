name: Publicar paquetes NuGet de Autorización

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Seguridad/Seguridad.MiddlewareAutorizacion/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: |
          dotnet restore "Seguridad/Seguridad.MiddlewareAutorizacion/Autorizacion.Middleware/Autorizacion.Middleware.csproj"

      - name: Compilar en Release
        run: |
          dotnet build "Seguridad/Seguridad.MiddlewareAutorizacion/Autorizacion.Middleware/Autorizacion.Middleware.csproj" --configuration Release --no-restore

      - name: Cleanup old .nupkg files
        run: |
          rm -f Seguridad/Seguridad.MiddlewareAutorizacion/nupkgs/*.nupkg

      - name: Empaquetar (dotnet pack)
        run: |
          dotnet pack "Seguridad/Seguridad.MiddlewareAutorizacion/Autorizacion.Middleware/Autorizacion.Middleware.csproj" --configuration Release --no-build --output "Seguridad/Seguridad.MiddlewareAutorizacion/nupkgs"

      - name: Set up NuGet source
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/SC-701/index.json" \
            --name "github" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      - name: Publicar en GitHub Packages
        run: |
          dotnet nuget push "Seguridad/Seguridad.MiddlewareAutorizacion/nupkgs/*.nupkg" \
            --source "github" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate